server:
  port: 8080

# CORS 允许的来源（逗号分隔，* = 开发模式不发送 credentials）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/star_weave?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.starweave.entity
  configuration:
    map-underscore-to-camel-case: true

# DeepSeek AI 审核配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-placeholder-replace-in-production}
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat

# JWT 认证
jwt:
  secret: ${JWT_SECRET:starweave-default-jwt-secret-key-minimum-256-bits-long-change-in-production}
  expiration: 604800000  # 7 天（毫秒）

afdian:
  oauth:
    client-id: ${AFDIAN_CLIENT_ID:}
    client-secret: ${AFDIAN_CLIENT_SECRET:}
    redirect-uri: ${AFDIAN_REDIRECT_URI:}

aliyun:
  cloudauth:
    enabled: ${ALIYUN_CLOUDAUTH_ENABLED:false}
    access-key-id: ${ALIYUN_CLOUDAUTH_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_CLOUDAUTH_ACCESS_KEY_SECRET:}
    endpoint: ${ALIYUN_CLOUDAUTH_ENDPOINT:cloudauth.aliyuncs.com}
    param-type: ${ALIYUN_CLOUDAUTH_PARAM_TYPE:normal}
    connect-timeout-ms: ${ALIYUN_CLOUDAUTH_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${ALIYUN_CLOUDAUTH_READ_TIMEOUT_MS:10000}

logging:
  level:
    root: WARN
    com.starweave: INFO
    org.mybatis: WARN
  file:
    name: ${STARWEAVE_LOG_FILE:${user.dir}/logs/starweave.log}
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 7
